[project]
name = "taskdeck"
version = "0.1.0"
description = "Shared background-task layer for Django 6 projects"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
]

[dependency-groups]
dev = [
    "django-tasks-db>=0.12.0",  # the ORM backend used in tests; not a runtime dep
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskdeck"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "RUF"]
# RUF012 wants ClassVar annotations on mutable class attributes, which is wrong
# for Django's Meta inner classes and model field declarations.
ignore = ["RUF012"]
