# Coolify service template for Relay staging (Contabo).
# Secrets (DATABASE_URL, SECRET_KEY, API keys, etc.) live in Coolify UI / API
# environment variables — never inline them here.
# Image tag: __IMAGE_TAG__ is substituted by .github/workflows/deploy-prod.yml
# (manual promote of a dev-proven release) with the exact format
# YYYYMMDD-HHMMSS-<7> (never :latest, never sha-<…>).
# CD path: GitHub Actions builds → GHCR → Coolify deploy API (no git clone on Contabo).
#
# Service set mirrors scripts/deploy_relay_sandbox.sh production list, minus
# inbound is enabled by the per-domain receipt-rule migration:
#   web                gunicorn (public; Traefik domains managed in Coolify UI)
#   worker             django.tasks DB worker on queue "default" (sends)
#   provider-events-worker  django.tasks DB worker on queue "provider-events" (SES/inbound)
#   scheduler          due campaigns/schedules, lease expiry, recovery, heartbeat
#   ses-ingress        drains SQS relay-production-ses-webhooks into django.tasks
#   cmp-callbacks      CMP webhook outbox dispatcher
#   aisl-ses-ingress   transports AISHL SES notifications to its webhook
#   sandbox-ses-ingress drains SQS relay-sandbox-ses-webhooks into django.tasks
#   client-callbacks   tenant client-callback outbox dispatcher
#   recipient-imports  recipient-list import jobs
# There is no prune container: finished django-tasks result rows are pruned by
# the scheduler loop itself (jobs.services.prune_finished_task_results, daily,
# 14-day retention, all queues). The retired AWS EventBridge
# relay-production-prune-database rule referenced a host script that was never
# implemented here and must stay retired: the scheduler is the single owner.
# Inbound ingress consumes only SQS_INBOUND_EMAIL_QUEUE_URL, configured in Coolify.
# DEV has no inbound ingress and cannot drain this production queue.
services:
  web:
    image: ghcr.io/datatalksclub/relay:__IMAGE_TAG__
    pull_policy: always
    restart: unless-stopped
    environment:
      DEBUG: "0"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      ALLOWED_HOSTS: relay.datatalks.club,origin.relay.datatalks.club,localhost,127.0.0.1,169.58.124.141
    command:
      - gunicorn
      - -c
      - gunicorn.conf.py
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --worker-class
      - gthread
      - --threads
      - "4"
      - --timeout
      - "60"
      - --access-logfile
      - "-"
      - relay.wsgi:application
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=2).read()
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    expose:
      - "8000"
    # Preserve the existing production routing managed outside this compose.
    labels:
      traefik.enable: "false"

  worker:
    image: ghcr.io/datatalksclub/relay:__IMAGE_TAG__
    pull_policy: always
    restart: unless-stopped
    command: ["python", "manage.py", "db_worker", "--queue-name", "default", "--interval", "1"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_healthcheck", "--queue-name", "default"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  provider-events-worker:
    image: ghcr.io/datatalksclub/relay:__IMAGE_TAG__
    pull_policy: always
    restart: unless-stopped
    command: ["python", "manage.py", "db_worker", "--queue-name", "provider-events", "--interval", "1"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_healthcheck", "--queue-name", "provider-events"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  scheduler:
    image: ghcr.io/datatalksclub/relay:__IMAGE_TAG__
    pull_policy: always
    restart: unless-stopped
    environment:
      RELAY_TRANSACTIONAL_MONITOR_MSMTP_CONFIG: /run/relay-ops-msmtprc
    volumes:
      # Reuse the existing host ops transport; never copy SMTP secrets into git/env.
      - /etc/msmtprc:/run/relay-ops-msmtprc:ro
    command: ["python", "manage.py", "run_relay_scheduler", "--interval", "15"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ses-ingress:
    image: ghcr.io/datatalksclub/relay:__IMAGE_TAG__
    pull_policy: always
    restart: unless-stopped
    command: ["python", "manage.py", "drain_sqs_ingress", "ses-webhooks", "--batch-size", "10", "--wait-time", "20"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  cmp-callbacks:
    image: ghcr.io/datatalksclub/relay:__IMAGE_TAG__
    pull_policy: always
    restart: unless-stopped
    command: ["python", "manage.py", "process_cmp_callbacks", "--batch-size", "25", "--idle-sleep", "5"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  aisl-ses-ingress:
    image: ghcr.io/datatalksclub/relay:__IMAGE_TAG__
    pull_policy: always
    restart: unless-stopped
    # AISHL is the sole mutation owner; acknowledge only after its HTTP 200.
    command: ["python", "manage.py", "drain_sqs_ingress", "aisl-ses-webhooks", "--batch-size", "1", "--wait-time", "20"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  sandbox-ses-ingress:
    image: ghcr.io/datatalksclub/relay:__IMAGE_TAG__
    pull_policy: always
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${SANDBOX_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${SANDBOX_AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: eu-west-1
      SQS_SANDBOX_SES_WEBHOOKS_QUEUE_URL: https://sqs.eu-west-1.amazonaws.com/817685572750/relay-sandbox-ses-webhooks
    command: ["python", "manage.py", "drain_sqs_ingress", "sandbox-ses-webhooks", "--batch-size", "10", "--wait-time", "20"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  client-callbacks:
    image: ghcr.io/datatalksclub/relay:__IMAGE_TAG__
    pull_policy: always
    restart: unless-stopped
    command: ["python", "manage.py", "process_client_callbacks", "--batch-size", "25", "--idle-sleep", "5"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  recipient-imports:
    image: ghcr.io/datatalksclub/relay:__IMAGE_TAG__
    pull_policy: always
    restart: unless-stopped
    command: ["python", "manage.py", "process_recipient_list_imports", "--batch-size", "10", "--idle-sleep", "5"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  inbound-deliveries:
    image: ghcr.io/datatalksclub/relay:__IMAGE_TAG__
    pull_policy: always
    restart: unless-stopped
    command: ["python", "manage.py", "process_inbound_deliveries"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  inbound-ingress:
    image: ghcr.io/datatalksclub/relay:__IMAGE_TAG__
    pull_policy: always
    restart: unless-stopped
    # Stage code before receipt cutover; absence of queue is intentional standby.
    command: ["sh", "-ec", 'if [ -n "$${SQS_INBOUND_EMAIL_QUEUE_URL:-}" ]; then exec python manage.py drain_sqs_ingress inbound-email --batch-size 10 --wait-time 20; else echo "inbound ingress standby: no queue configured"; exec sleep infinity; fi']
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
