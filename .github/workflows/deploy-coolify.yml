name: Deploy Relay Coolify (Contabo)

# Pilot CD: GHA builds linux/amd64 → GHCR → Coolify pulls image via deploy API.
# No git SSH / deploy keys / git clone on Contabo.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/workflows/deploy-development.yml"
      - ".github/workflows/deploy-prod.yml"
      - ".github/workflows/deploy-sandbox.yml"

concurrency:
  group: relay-coolify
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: datatalksclub/relay

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Lint and Django checks
        run: |
          uv run ruff check .
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py check
      - name: Tests
        run: uv run pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.identity.outputs.version }}
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Construct release identity (exact ECR tag format)
        id: identity
        run: |
          set -euo pipefail
          # Same construction as website .github/workflows/deploy-dev.yml:
          #   version="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          # CMP/AISHL deploy-dev: DATE=$(date +'%Y%m%d-%H%M%S'); SHORT_SHA=…; TAG=${DATE}-${SHORT_SHA}
          # Live ECR example (CMP): 20261021-094333-f922dc4
          version="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Exact ECR production tag only (YYYYMMDD-HHMMSS-<7>). Never :latest. Never sha-<…>.
          tags: |
            type=raw,value=${{ steps.identity.outputs.version }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/amd64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Packages stay private; Contabo pulls via Coolify Registries read:packages PAT.

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    # Staging Contabo Coolify only — production AWS workflows stay separate.
    environment: coolify-staging
    steps:
      - uses: actions/checkout@v5

      - name: Apply Coolify compose template and deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_RELAY_SERVICE_UUID }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${COOLIFY_URL:-}" || -z "${COOLIFY_TOKEN:-}" || -z "${COOLIFY_SERVICE_UUID:-}" ]]; then
            echo "Missing Coolify secrets: COOLIFY_URL, COOLIFY_TOKEN, COOLIFY_RELAY_SERVICE_UUID" >&2
            exit 1
          fi
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import base64, json, os, re, urllib.request
          import yaml

          base = os.environ["COOLIFY_URL"].rstrip("/")
          token = os.environ["COOLIFY_TOKEN"]
          uuid = os.environ["COOLIFY_SERVICE_UUID"]
          image_ref = os.environ["IMAGE_REF"]
          image_tag = os.environ["IMAGE_TAG"]
          prefix = f"{image_ref}:"
          template_path = "deploy/coolify/docker-compose.staging.yml"

          def call(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{base}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  body = resp.read()
                  return resp.status, (json.loads(body) if body else {})

          with open(template_path) as fh:
              template_text = fh.read()
          assert "__IMAGE_TAG__" in template_text, "compose template has no __IMAGE_TAG__ placeholder"
          rendered = template_text.replace("__IMAGE_TAG__", image_tag)
          assert "__IMAGE_TAG__" not in rendered
          wanted = yaml.safe_load(rendered)
          assert set(wanted) == {"services"}, f"unexpected top-level keys: {sorted(wanted)}"
          for name, svc in wanted["services"].items():
              assert svc.get("image", "").startswith(prefix), f"service {name} image not pinned to {prefix}*"
              assert re.fullmatch(r"\d{8}-\d{6}-[0-9a-f]{7}", svc["image"][len(prefix):] or ""), (
                  f"service {name} image tag is not exact YYYYMMDD-HHMMSS-<7>: {svc['image']}"
              )

          _st, svc = call("GET", f"/api/v1/services/{uuid}")
          live = yaml.safe_load(svc["docker_compose_raw"])
          live_services = live.get("services", {})
          wanted_services = wanted["services"]

          # Fail closed instead of clobbering human-managed routing: the live
          # web service must match the template except for the image tag, and
          # the live compose must not contain services the template doesn't.
          live_web = dict(live_services.get("web", {}))
          wanted_web = dict(wanted_services["web"])
          assert live_web.get("image", "").startswith(prefix), "live web image is not a relay GHCR image; refusing to overwrite"
          live_web.pop("image", None)
          wanted_web.pop("image", None)
          assert live_web == wanted_web, (
              "live web service differs from the template (domains/labels managed outside git?). "
              "Refusing to overwrite; reconcile Coolify UI state with deploy/coolify/docker-compose.staging.yml first."
          )
          unknown = sorted(set(live_services) - set(wanted_services))
          assert not unknown, f"live compose has services not in the template {unknown}; refusing to overwrite"
          added = sorted(set(wanted_services) - set(live_services))
          print(f"compose guard OK; services to add on Coolify: {added or ['(none)']}")

          call(
              "PATCH",
              f"/api/v1/services/{uuid}",
              {"docker_compose_raw": base64.b64encode(rendered.encode()).decode()},
          )
          _st, out = call("POST", f"/api/v1/deploy?uuid={uuid}&force=true")
          print(json.dumps(out))
          print(f"Applied template with {prefix}{image_tag} on all {len(wanted_services)} services and triggered deploy for {uuid}")
          PY

      - name: Verify Coolify status and public web health
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_RELAY_SERVICE_UUID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request

          base = os.environ["COOLIFY_URL"].rstrip("/")
          token = os.environ["COOLIFY_TOKEN"]
          uuid = os.environ["COOLIFY_SERVICE_UUID"]

          def call(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{base}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  body = resp.read()
                  return resp.status, (json.loads(body) if body else {})

          status = None
          for _ in range(96):  # ~8 minutes
              _st, svc = call("GET", f"/api/v1/services/{uuid}")
              status = svc.get("status")
              print(f"coolify service status: {status}", flush=True)
              if status == "running:healthy":
                  break
              time.sleep(5)
          print(f"final coolify service status: {status}")
          PY
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error https://relay.datatalks.club/health/ready; then
              echo; echo "public web health OK"; break
            fi
            if [ "$_" -eq 30 ]; then
              echo "public web health check FAILED (routing broken by this change?)" >&2
              exit 1
            fi
            sleep 10
          done
          # The same Contabo host also serves dev.relay.datatalks.club (the
          # retired AWS EC2 dev host is gone; Deploy Relay Development polls
          # this URL as its release gate), so verify it here too.
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error https://dev.relay.datatalks.club/health/ready; then
              echo; echo "dev web health OK"; exit 0
            fi
            sleep 10
          done
          echo "dev web health check FAILED" >&2
          exit 1
