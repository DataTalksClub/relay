# Production-shaped stack: gunicorn, a task worker, and the ingress drains,
# all from one image, behind Caddy for TLS.
#
# The worker is a separate container rather than a thread inside web so that a
# large campaign send cannot starve request handling, and so `docker compose
# logs worker` answers "what is the queue doing" without filtering.

# Run from the repository root:
#
#   docker compose -f deploy/docker-compose.yml --env-file .env <command>
#
# Compose takes the project directory from this file's location, so paths here
# are relative to `deploy/` and the repository root is `..`. The --env-file is
# what feeds the ${...} interpolation below; `env_file:` covers the containers.

# Pinned because Compose would otherwise name the project after this file's
# directory ("deploy"), which would point the stack at a new, empty set of
# volumes rather than the existing datamailer_* ones.
name: datamailer

x-app: &app
  image: datamailer:latest
  build:
    context: ..
  restart: unless-stopped
  # The same file Django's settings.py reads via load_dotenv, so a container
  # and a `manage.py` run on the host see one set of values, not two that drift.
  env_file: ../.env
  environment:
    # The one setting that decides which database the whole stack uses.
    # dj_database_url parses it, so moving to a managed Postgres is this line
    # in .env and nothing else -- see docs/managed-database-migration.md. The
    # db service below is the default value's target, not an assumption baked
    # into the app.
    DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-datamailer_user}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-datamailer}}
  depends_on:
    db:
      condition: service_healthy

services:
  # Postgres on this host, in a container: no RDS bill, and one less moving
  # part while this is a sandbox. It is addressed only through DATABASE_URL,
  # so replacing it with a managed endpoint does not touch the app services.
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datamailer}
      POSTGRES_USER: ${POSTGRES_USER:-datamailer_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datamailer_user} -d ${POSTGRES_DB:-datamailer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    command: uv run python manage.py migrate --noinput

  web:
    <<: *app
    command: uv run gunicorn datamailer.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    # Runs the django.tasks database backend's worker. Task code is unchanged
    # by this choice; swapping the backend swaps this command and nothing else.
    command: uv run python manage.py db_worker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The two queues AWS writes into directly. Disabled unless their queue URLs
  # are configured, so a deployment without SES wiring still comes up cleanly.
  ingress-ses:
    <<: *app
    profiles: ["ingress"]
    command: uv run python manage.py drain_sqs_ingress ses-webhooks

  ingress-inbound:
    <<: *app
    profiles: ["ingress"]
    command: uv run python manage.py drain_sqs_ingress inbound-email

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS must be set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
