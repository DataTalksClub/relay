name: Deploy Relay Development

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: relay-development
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEVELOPMENT_HEALTH_URL: https://dev.relay.datatalks.club/health/ready

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Run lint and checks
        run: |
          uv run ruff check .
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py check
      - name: Run tests
        run: uv run pytest

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Delivery to dev.relay.datatalks.club runs through the
    # "Deploy Relay Coolify (Contabo)" workflow: the former AWS EC2 host
    # (i-0a3d2851cb906dc69) was terminated during the Contabo cutover on
    # 2026-10-22, and the public origin now points at the Contabo host, so
    # there is no SSM target left. This job keeps the push-to-main gate and
    # verifies the development entry point instead of sending SSM commands.
    # Production and the retired sandbox are separate workflows.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Verify public development health
        run: |
          set -euo pipefail
          echo "Delivery to dev.relay.datatalks.club runs via the Deploy Relay Coolify (Contabo) workflow."
          echo "This job verifies the development entry point after the test gate."
          # The Coolify deploy of the same push takes ~15 minutes, so this
          # polls up to 30 minutes before failing.
          for _ in $(seq 1 360); do
            if curl --fail --silent --show-error "$DEVELOPMENT_HEALTH_URL"; then
              echo
              echo "development health OK"
              exit 0
            fi
            sleep 5
          done
          echo "Development health did not become ready within 30 minutes" >&2
          exit 1
